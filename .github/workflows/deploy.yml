name: Flight Booking Microservices CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: "Deploy to EC2 after building? (Make sure EC2 is running)"
        type: boolean
        default: false

jobs:
  # 1. Fast syntax check across all services & shared code
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Python syntax check
        run: python3 -m compileall services shared

  # 2. Build & push all 5 microservices in parallel
  build-and-push:
    needs: ci-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - auth-service
          - booking-service
          - flight-service
          - private-jet-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        run: |
          docker build \
            -f services/${{ matrix.service }}/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/flight-${{ matrix.service }}:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/flight-${{ matrix.service }}:latest

  # 3. Only runs when you manually trigger the workflow with deploy_to_ec2 = true
  deploy:
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_ec2 == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/flight-booking-backend
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f